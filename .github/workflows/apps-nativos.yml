name: Apps nativos (Nearby)
on:
  push:
    branches: [main]
    paths: ["apps/android-nearby/**", "apps/ios-nearby/**", "docs/protocolo/**", ".github/workflows/apps-nativos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/android-nearby } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes do protocolo (vetores compartilhados) e APK de testes
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug -Palerta.versionCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: alerta-nearby-android-apk
          path: apps/android-nearby/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-testes, path: apps/android-nearby/app/build/reports/tests }
      - name: Publicar APK de testes como release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk alerta-nearby-demo.apk
          gh release delete apk-testes -y --cleanup-tag || true
          gh release create apk-testes alerta-nearby-demo.apk --prerelease --title "APK de testes (demonstração)" \
            --notes "APK de DEMONSTRAÇÃO (debug), build ${{ github.run_number }} do commit ${{ github.sha }}. Dados fictícios. Não é versão de produção."

  ios:
    runs-on: macos-15
    defaults: { run: { working-directory: apps/ios-nearby } }
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: BUNDLE_ID=br.alertaemacao.nearby.ci ./gerar-projeto.sh
      - name: Compilar para simulador e rodar testes do protocolo
        run: |
          set -o pipefail
          DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^()]*' | sed 's/ *$//')"
          echo "Destino: $DEST"
          xcodebuild -project AlertaNearby.xcodeproj -scheme AlertaNearby -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO test | tee xcodebuild.log | tail -80
      - name: Compilar para aparelho (sem assinatura — prova de compilação arm64)
        run: |
          set -o pipefail
          xcodebuild -project AlertaNearby.xcodeproj -scheme AlertaNearby -sdk iphoneos -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -30
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-build-log, path: apps/ios-nearby/xcodebuild.log }
